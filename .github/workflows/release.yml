name: Release

# Publishes to npm when a v* tag is pushed. The tag is the trigger, so the
# published version is whatever package.json says at that commit — bump it in a
# commit, then tag that commit.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The tag and package.json must agree, or `npm publish` silently ships a
      # version nobody tagged.
      - name: verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "publishing $name@$version"

      # prepublishOnly runs build + tests again; this is the same gate CI ran.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
