<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>js-aruco3 — marker creator</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; }
  .panel { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; margin-bottom: 20px; }
  label { display: grid; gap: 4px; font-size: 13px; }
  input, select { font: inherit; padding: 4px 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; text-align: center; }
  figure svg { width: 140px; height: 140px; background: #fff; border: 1px solid #8884; }
  figcaption { font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .warn { color: #9c6404; font-size: 13px; }
  @media print {
    .panel, .warn, h1 { display: none; }
    figure svg { border: none; }
  }
</style>
</head>
<body>

<h1>Marker creator</h1>

<div class="panel">
  <label>Dictionary <select id="dictionary"></select></label>
  <label>First id <input type="number" id="from" value="0" min="0" style="width: 6em"></label>
  <label>Count <input type="number" id="count" value="12" min="1" max="200" style="width: 6em"></label>
  <label>Size (mm) <input type="number" id="mm" value="50" min="5" style="width: 6em"></label>
  <button id="print">Print</button>
  <button id="download">Download SVG</button>
</div>

<p id="info" class="warn"></p>
<div class="grid" id="grid"></div>

<script type="module">
import { Dictionary } from '../../src/index.js';
import { loadDictionaryDefinition, DICTIONARY_NAMES } from '../../src/dictionaries/index.js';

const $ = (id) => document.getElementById(id);

for (const name of DICTIONARY_NAMES) {
  $('dictionary').append(new Option(name, name, name === 'DICT_5X5_50', name === 'DICT_5X5_50'));
}

// deep-link support: ?dictionary=DICT_5X5_50&from=0&count=12
const params = new URLSearchParams(location.search);
if (params.get('dictionary')) $('dictionary').value = params.get('dictionary');
for (const k of ['from', 'count', 'mm']) if (params.get(k)) $(k).value = params.get(k);

let dict = null;

async function render() {
  const def = await loadDictionaryDefinition($('dictionary').value);
  dict = new Dictionary(def);

  const from = Math.max(0, Number($('from').value) | 0);
  const count = Math.min(200, Math.max(1, Number($('count').value) | 0));
  const mm = Number($('mm').value);

  const notes = [`${dict.length} ids · ${dict.gridSize}×${dict.gridSize} grid · ` +
    `corrects up to ${dict.maxCorrectionBits} bit error${dict.maxCorrectionBits === 1 ? '' : 's'}`];
  if (dict.warnings.length) notes.push(...dict.warnings);
  $('info').textContent = notes.join(' — ');

  const figures = [];
  for (let i = 0; i < count; i++) {
    const id = dict.ids[from + i];
    if (id === undefined) break;
    const fig = document.createElement('figure');
    fig.innerHTML = dict.toSVG(id, { moduleSize: 10 });
    const cap = document.createElement('figcaption');
    // the printed side length includes the quiet zone
    const modules = dict.gridSize + 2 + 2;
    cap.textContent = `id ${id} · ${mm} mm · ${(mm / modules).toFixed(1)} mm/module`;
    fig.append(cap);
    figures.push(fig);
  }
  $('grid').replaceChildren(...figures);
}

for (const id of ['dictionary', 'from', 'count', 'mm']) {
  $(id).addEventListener('change', render);
}
$('print').addEventListener('click', () => print());
$('download').addEventListener('click', () => {
  const id = dict.ids[Math.max(0, Number($('from').value) | 0)];
  const blob = new Blob([dict.toSVG(id, { moduleSize: 10 })], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), {
    href: url,
    download: `${dict.name}-${id}.svg`,
  });
  // Firefox needs the anchor in the document, and revoking synchronously after
  // click() can cancel the download before it starts.
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
});

render();
</script>
</body>
</html>
